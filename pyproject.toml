[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-blog-article-generator"
version = "0.6.3"
description = "Windows desktop tool that turns a topic brief into a full blog article with pluggable LLM providers."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aiblog-generator maintainers" }]
keywords = ["blog", "article", "generator", "llm", "seo", "windows", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "httpx>=0.27,<0.29",
  "pydantic>=2.7,<3",
  "tomli-w>=1.0",
  "keyring>=25.2",
  "rich>=13.7",
  "markdown-it-py>=3.0",
  "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-toml",
]

[project.scripts]
aiblog = "aiblog.__main__:main"

[project.gui-scripts]
aiblog-gui = "aiblog.desktop.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiblog"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aiblog"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"